[project]
name = "kernoscope"
version = "0.2.3"
description = "Provenance-honest CUDA kernel profiler for locked-down / multi-tenant GPUs; ncu-compatible CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kernoscope contributors" }]
keywords = [
    "ncu", "nsight-compute", "gpu-profiler", "cuda", "profiling",
    "roofline", "occupancy", "provenance", "nvbit", "nsys",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
# 运行时零第三方依赖：只用标准库 + 外部命令（nsys / nvidia-smi / cuobjdump）。
dependencies = []

[project.optional-dependencies]
# 设备级计数器（能耗/显存忙碌）：可选；优先 pynvml，缺它时退回 nvidia-smi 子进程轮询
nvml = ["nvidia-ml-py>=12.535"]

[project.scripts]
kernoscope = "kernoscope.cli:main"
ksc = "kernoscope.cli:main"

[project.urls]
Homepage = "https://github.com/QingGo/Kernoscope"
Repository = "https://github.com/QingGo/Kernoscope"
Documentation = "https://github.com/QingGo/Kernoscope#readme"
Issues = "https://github.com/QingGo/Kernoscope/issues"
Changelog = "https://github.com/QingGo/Kernoscope/commits/main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernoscope"]

# skill 必须随包发布：`kernoscope skill --apply` 是**装了包的用户**唯一能自己接上 agent 的路，
# 而它在源码 checkout 之外找不到 skills/ 就等于没有这个功能（I4）。
[tool.hatch.build.targets.wheel.force-include]
"skills/kernoscope" = "kernoscope/skills/kernoscope"
# 标定脚本必须随包发布：pip 装出来的用户**唯一**能做本机标定的路是 `kernoscope calibrate`，
# 而它按 `tools/machine-profile.py` 找不到文件就等于没有这个功能（A-2′/R-127，全新环境实测）。
# 实现仍只有 `tools/` 里那一份，这里只是把它放进 wheel。
"tools/machine-profile.py" = "kernoscope/_machine_profile.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# R-109：**本仓库的 `src/` 是权威**。editable 安装的 `.pth` 钉住的是"安装那一刻"的源码树
# （同步出来的副本、另一棵 checkout 都会有各自的 .pth），而 pytest 从前没有 pythonpath
# 设置 ⇒ 单跑某些测试会 import 到**别的** src 却全绿（第六轮验收里一个复核集群正是在改
# `src/` 的变异上被这样骗过一次：假绿）。pytest 在收集任何测试之前把这里的路径插到
# `sys.path[0]`，因此它优先于 .pth 与 PYTHONPATH；断言见 tests/test_src_authority.py。
pythonpath = ["src"]
# 不设 addopts：曾经写的是 "-q"，于是 `uv run pytest -q` 变成 `-qq`，汇总行被吞掉 ——
# 对只靠命令行自证的 agent 来说这是个纯损失，它会把"没看到 passed"当成"测试没跑"。
