[project]
name = "kernoscope"
version = "0.1.0"
description = "Provenance-honest CUDA kernel profiler for locked-down / multi-tenant GPUs. ncu-compatible CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kernoscope contributors" }]
keywords = [
    "ncu", "nsight-compute", "gpu-profiler", "cuda", "profiling",
    "roofline", "occupancy", "provenance", "nvbit", "nsys",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# 设备级计数器（能耗等）：可选
nvml = ["nvidia-ml-py>=12.535"]
# 参考实现 / 交叉验证：可选
analyze = ["numpy>=1.24"]

[project.scripts]
kernoscope = "kernoscope.cli:main"
ksc = "kernoscope.cli:main"

[project.urls]
Homepage = "https://github.com/kernoscope/kernoscope"
Documentation = "https://github.com/kernoscope/kernoscope/tree/main/docs"
Issues = "https://github.com/kernoscope/kernoscope/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernoscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
